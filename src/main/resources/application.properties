spring.application.name=MyeCommerceStore

# ===============================
# DATABASE CONFIG (Railway)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Railway provides dynamic PORT
server.port=${PORT:8080}

# ===============================
# PROJECT CONFIG
# ===============================
project.image=images/

# ===============================
# SECURITY CONFIG (Move secrets to Railway variables)
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
spring.app.CookieGen=springBootEcom

# ===============================
# FRONTEND URL (Will set in Railway)
# ===============================
frontend.url=${FRONTEND_URL}

# ===============================
# STRIPE CONFIG
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}

# ===============================
# LOGGING (Keep clean for production)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.com.eCommerce=INFO

DEBUG=false

# ===============================
# CLOUDINARY CONFIG
# ===============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
